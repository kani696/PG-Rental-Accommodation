
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notifications - PG Finder</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .notifications-container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .notification-card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .notification-card.unread {
            border-left: 5px solid #3498db;
            background: #eef7ff;
        }

        .notification-message {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .notification-date {
            color: #777;
            font-size: 13px;
        }

        .read-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .read-btn:disabled {
            background: #999;
            cursor: default;
        }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="notifications-container">

        <h1>My Notifications 🔔</h1>

        <p>Stay updated about your booking requests.</p>

        <div id="notificationList">
            <p>Loading notifications...</p>
        </div>

        <br>

        <a href="search.html">Back to Home</a>

    </div>

    <script src="js/notifications.js"></script>

</body>
</html>
