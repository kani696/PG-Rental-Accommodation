<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - PG Rental Accommodation Finder</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="registration-card">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your PG Rental Accommodation Finder account.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" id="loginButton">
                    Login
                </button>

                <p id="message"></p>

            </form>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
