<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Properties - PG Rental Accommodation Finder</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <div class="registration-card">

            <h1>Find a PG</h1>

            <p class="subtitle">
                Search for PG accommodations by location or property name.
            </p>

            <form id="searchForm">

                <div class="form-group">
                    <label for="searchInput">
                        Location or Property Name
                    </label>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Example: Coimbatore"
                    >
                </div>

                <button type="submit">
                    Search Properties
                </button>

            </form>

        </div>

        <div id="results"></div>

    </div>

    <script src="js/search.js"></script>

</body>

</html>
