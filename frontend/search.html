
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search PG Properties</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <div class="registration-card">
            <h1>Find Your PG</h1>
            <p class="subtitle">Search and filter PG accommodations.</p>

            <form id="searchForm">

                <div class="form-group">
                    <label for="searchInput">Location or Property Name</label>
                    <input type="text" id="searchInput"
                        placeholder="Example: Coimbatore">
                </div>

                <div class="form-group">
                    <label for="maxRent">Maximum Rent (₹)</label>
                    <input type="number" id="maxRent"
                        min="0" placeholder="Enter maximum rent">
                </div>

                <div class="form-group">
                    <label for="roomType">Room Type</label>
                    <select id="roomType">
                        <option value="">All Rooms</option>
                        <option value="Single">Single</option>
                        <option value="Shared">Shared</option>
                        <option value="Double">Double</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="availability">Availability</label>
                    <select id="availability">
                        <option value="">All Properties</option>
                        <option value="Available">Available</option>
                        <option value="Not Available">Not Available</option>
                    </select>
                </div>

                <button type="submit">Search Properties</button>

            </form>
        </div>

        <div id="results"></div>
    </div>

    <script src="js/search.js"></script>
</body>
</html>
